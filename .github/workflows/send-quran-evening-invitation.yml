name: Send Quran Evening Invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[send-quran-1740]')
    runs-on: ubuntu-latest
    steps:
      - name: Send invitation from VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              now=$(date -u +%s)
              target=$(date -u -d '2026-08-17 16:40:00' +%s)
              if [ "$now" -lt "$target" ]; then sleep $((target - now)); fi
              if [ "$(date -u +%Y-%m-%d)" != "2026-08-17" ]; then exit 0; fi
            fi
            cd ${{ secrets.VPS_PATH }}
            git pull --ff-only origin main
            docker compose up -d --build backend
            docker compose exec -T backend node dist/send-quran-evening-invitation.js
            docker compose exec -T backend node dist/send-quran-evening-invitation.js --send
