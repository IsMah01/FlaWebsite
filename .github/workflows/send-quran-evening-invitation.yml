name: Send Quran Evening Invitation

on:
  schedule:
    - cron: "30 16 17 8 *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send invitation from VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%Y-%m-%d)" != "2026-08-17" ]; then exit 0; fi
            cd ${{ secrets.VPS_PATH }}
            git pull --ff-only origin main
            docker compose up -d --build backend
            docker compose exec -T backend node dist/send-quran-evening-invitation.js
            docker compose exec -T backend node dist/send-quran-evening-invitation.js --send
