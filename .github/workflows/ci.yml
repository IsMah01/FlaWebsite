name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Temporary baseline: keep the existing TypeScript debt visible without
      # blocking pull requests. Remove continue-on-error once the debt is fixed.
      - name: TypeScript check (non-blocking baseline)
        continue-on-error: true
        run: npm run check

      - name: Tests
        run: npm test -- --passWithNoTests

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            --file apps/backend/Dockerfile \
            --tag flf-backend:ci \
            .
