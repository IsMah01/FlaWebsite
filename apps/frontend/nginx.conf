server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; child-src https://www.youtube.com https://www.youtube-nocookie.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; form-action 'self'" always;

    location ~* (^|/)\.|(\.(bak|backup|old|orig|save|swp|tmp|zip|tar|gz|sql|env|log|config|ini|yml|yaml|toml)(~)?$) {
        deny all;
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; child-src https://www.youtube.com https://www.youtube-nocookie.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /activity-media/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000" always;
        expires 30d;
    }

    location = /fla-interviews {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files /fla-interviews/index.html =404;
    }

    location = /news/academy-18-opening-ceremony {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        sub_filter_once on;
        sub_filter '</head>' '<meta property="og:type" content="article" /><meta property="og:site_name" content="مؤسسة أطر الغد" /><meta property="og:title" content="أكاديمية أطر الغد تفتتح دورتها الثامنة عشرة بحفل يجمع بين بناء الكفاءة وصناعة الأثر" /><meta property="og:description" content="افتتحت أكاديمية أطر الغد، مساء الجمعة 14 غشت 2026، فعاليات دورتها الثامنة عشرة، خلال حفل افتتاحي احتضنه المركز الثقافي بأكدال بمدينة الرباط." /><meta property="og:url" content="https://flf.ma/news/academy-18-opening-ceremony" /><meta property="og:image" content="https://flf.ma/news-media/academy-18-opening/01.jpg" /><meta property="og:image:alt" content="حفل افتتاح الدورة الثامنة عشرة لأكاديمية أطر الغد" /><meta name="twitter:card" content="summary_large_image" /><meta name="twitter:title" content="أكاديمية أطر الغد تفتتح دورتها الثامنة عشرة" /><meta name="twitter:description" content="افتتاح فعاليات الدورة الثامنة عشرة لأكاديمية أطر الغد بمدينة الرباط." /><meta name="twitter:image" content="https://flf.ma/news-media/academy-18-opening/01.jpg" /></head>';
        try_files /index.html =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; child-src https://www.youtube.com https://www.youtube-nocookie.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
